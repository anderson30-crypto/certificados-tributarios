# ALTERNATIVA (solo si el 443 del web14 ya lo usa Apache; ver LEEME.md). Apache publica el aplicativo en https://certributario.bucaramanga.upb.edu.co
# Copiar a /etc/httpd/conf.d/certributario.conf, probar con "apachectl configtest" y recargar con
# "systemctl reload httpd". El aplicativo corre aparte en http://127.0.0.1:7000 (servicio certributario).
#
# En Red Hat, SELinux no deja que Apache se conecte al puerto 7000 hasta ejecutar una vez:
#   setsebool -P httpd_can_network_connect 1

<VirtualHost *:443>
    ServerName certributario.bucaramanga.upb.edu.co

    # Certificado comodín *.bucaramanga.upb.edu.co entregado por Infraestructura (Héctor Báez)
    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/STAR_bucaramanga_upb_edu_co.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/web14.key
    SSLCertificateChainFile /etc/pki/tls/certs/STAR_bucaramanga_upb_edu_co.ca-bundle

    ProxyPreserveHost On
    # El envío masivo de correos es una sola petición con pausa de 2,5 s por correo:
    # con cientos de contratistas tarda varios minutos, por eso el tiempo de espera es de 30 min
    ProxyPass        / http://127.0.0.1:7000/ timeout=1800
    ProxyPassReverse / http://127.0.0.1:7000/
    RequestHeader set X-Forwarded-Proto "https"

    # Reportes de Excel de hasta 50 MB
    LimitRequestBody 52428800

    ErrorLog  /var/log/httpd/certributario_error.log
    CustomLog /var/log/httpd/certributario_access.log combined
</VirtualHost>

# Todo lo que llegue por http se manda a https
<VirtualHost *:80>
    ServerName certributario.bucaramanga.upb.edu.co
    Redirect permanent / https://certributario.bucaramanga.upb.edu.co/
</VirtualHost>
