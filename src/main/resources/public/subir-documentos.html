<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Subir Documentos</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --link-blue: #2D6CDF;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  /* ---------- Header ---------- */
  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    display: flex;
    align-items: center;
  }

  .brand .logo-mark img{
    height: 30px;
    width: auto;
    display: block;
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  /* ---------- Main content ---------- */
  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 40px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .section-title{
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 30px;
  }

  .upload-layout{
    display: flex;
    gap: 40px;
    max-width: 780px;
    margin: 0 auto;
    flex-wrap: wrap;
  }

  .upload-panel{
    flex: 1 1 260px;
  }

  .dropzone{
    background: var(--gray-bg);
    border: 2px dashed var(--gray-border);
    border-radius: 6px;
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    padding: 16px;
  }

  .dropzone.dragover{
    border-color: var(--red);
    background: #FDECEC;
  }

  .dropzone .upload-icon{
    font-size: 26px;
    margin-bottom: 10px;
    color: var(--text-muted);
  }

  .dropzone .select-link{
    color: var(--link-blue);
    font-size: 12px;
    text-decoration: underline;
  }

  .dropzone .hint{
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .btn-upload{
    margin-top: 16px;
    padding: 9px 26px;
    background: var(--red);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: block;
  }

  .btn-upload:hover{
    background: var(--red-dark);
  }

  .results-panel{
    flex: 1 1 300px;
  }

  .results-panel h3{
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 12px;
  }

  .file-list{
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 200px;
  }

  .file-list .empty-row{
    background: var(--gray-bg);
    border-radius: 20px;
    height: 34px;
  }

  .file-item{
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 20px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 12px;
  }

  .file-item .file-name{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-item .remove-file{
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
  }

  .actions-row{
    display: flex;
    justify-content: flex-end;
    max-width: 780px;
    margin: 24px auto 0;
  }

  .btn-next{
    padding: 10px 22px;
    background: var(--red);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-next:hover{
    background: var(--red-dark);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><img src="images/upb-logo.png" alt="UPB"></div>
    </div>
    <div class="page-title">Subir Documentos</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" id="notifBtn" href="notificaciones-error.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></a>
      <a class="user-chip" href="perfil.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span> Inicio
    </a>
    <a class="nav-item active" href="subir-documentos.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Certificados
    </a>
    <a class="nav-item" href="historial.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span> Historial
    </a>
    <a class="nav-item" href="perfil.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Subir Documentos</div>

    <h2 class="section-title">Subir Documento</h2>

    <div class="upload-layout">
      <div class="upload-panel">
        <div class="dropzone" id="dropzone">
          <div class="upload-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
          <div class="select-link" id="selectLink">Seleccionar archivo</div>
          <div class="hint">o arrastra tu documento aquí</div>
          <input type="file" id="fileInput" multiple style="display:none">
        </div>
        <button class="btn-upload" id="btnUpload">Subir</button>
      </div>

      <div class="results-panel">
        <h3>Subidos</h3>
        <ul class="file-list" id="fileList">
          <li class="empty-row"></li>
          <li class="empty-row"></li>
          <li class="empty-row"></li>
        </ul>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-next" id="btnNext">Siguiente ›</button>
    </div>
  </main>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const selectLink = document.getElementById('selectLink');
  const fileList = document.getElementById('fileList');
  const btnUpload = document.getElementById('btnUpload');
  const btnNext = document.getElementById('btnNext');

  let pendingFiles = [];
  let uploadedFiles = [];

  function renderFileList(){
    fileList.innerHTML = '';
    if(uploadedFiles.length === 0){
      fileList.innerHTML = '<li class="empty-row"></li><li class="empty-row"></li><li class="empty-row"></li>';
      return;
    }
    uploadedFiles.forEach(function(name, index){
      const li = document.createElement('li');
      li.className = 'file-item';
      li.innerHTML = '<span class="file-name">' + name + '</span><button class="remove-file" data-index="' + index + '"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
      fileList.appendChild(li);
    });

    document.querySelectorAll('.remove-file').forEach(function(btn){
      btn.addEventListener('click', function(){
        const idx = parseInt(btn.getAttribute('data-index'), 10);
        uploadedFiles.splice(idx, 1);
        renderFileList();
      });
    });
  }

  dropzone.addEventListener('click', function(){
    fileInput.click();
  });

  fileInput.addEventListener('change', function(e){
    pendingFiles = Array.from(e.target.files);
    dropzone.querySelector('.hint').textContent = pendingFiles.length + ' archivo(s) listo(s) para subir';
  });

  ['dragover'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });

  dropzone.addEventListener('drop', function(e){
    pendingFiles = Array.from(e.dataTransfer.files);
    dropzone.querySelector('.hint').textContent = pendingFiles.length + ' archivo(s) listo(s) para subir';
  });

  btnUpload.addEventListener('click', function(){
    if(pendingFiles.length === 0){
      alert('Selecciona o arrastra al menos un archivo antes de subir.');
      return;
    }
    pendingFiles.forEach(function(f){
      uploadedFiles.push(f.name);
    });
    pendingFiles = [];
    dropzone.querySelector('.hint').textContent = 'o arrastra tu documento aquí';
    fileInput.value = '';
    renderFileList();
  });

  btnNext.addEventListener('click', function(){
    if(uploadedFiles.length === 0){
      alert('Debes subir al menos un documento para continuar.');
      return;
    }
    console.log('Continuar con documentos:', uploadedFiles);
    window.location.href = 'generar-certificado.html';
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
