<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Certificado Generado</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    width: 28px;
    height: 28px;
    background: #ffffff;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--red);
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .cert-card{
    max-width: 340px;
    margin: 30px auto 0;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 8px;
    padding: 30px 26px;
    text-align: center;
  }

  .cert-icon{
    font-size: 46px;
    margin-bottom: 14px;
    cursor: pointer;
  }

  .cert-meta{
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 20px;
    text-align: left;
    padding: 0 8px;
  }

  .cert-meta strong{
    color: var(--text-dark);
  }

  .cert-actions{
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn{
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  .btn-primary{
    background: var(--red);
    color: #ffffff;
  }

  .btn-primary:hover{
    background: var(--red-dark);
  }

  .btn-secondary{
    background: #ffffff;
    color: var(--text-dark);
    border: 1px solid var(--gray-border);
  }

  .btn-secondary:hover{
    border-color: var(--red);
    color: var(--red);
  }

  .success-banner{
    max-width: 340px;
    margin: 0 auto 6px;
    text-align: center;
    color: #1E8E3E;
    font-size: 12px;
    font-weight: 600;
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">UPB</div>
    </div>
    <div class="page-title">Certificados</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html">🔔<span class="dot"></span></a>
      <a class="user-chip" href="perfil.html">👤 Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon">🏠</span> Inicio
    </a>
    <a class="nav-item active" href="subir-documentos.html">
      <span class="nav-icon">📄</span> Certificados
    </a>
    <a class="nav-item" data-page="historial">
      <span class="nav-icon">🕘</span> Historial
    </a>
    <a class="nav-item" data-page="configuracion">
      <span class="nav-icon">⚙️</span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon">↪</span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Generar Certificado &nbsp;›&nbsp; Certificado</div>

    <div class="success-banner">✔ Certificado generado con éxito</div>

    <div class="cert-card">
      <div class="cert-icon" id="certIcon" title="Ver certificado">📄</div>
      <div class="cert-meta">
        <div><strong>Folio:</strong> <span id="folio"></span></div>
        <div><strong>Generado el:</strong> <span id="fecha"></span></div>
        <div><strong>Documentos incluidos:</strong> <span id="numDocs"></span></div>
      </div>
      <div class="cert-actions">
        <button class="btn btn-secondary" id="btnDescargar">⬇ Descargar</button>
        <a class="btn btn-primary" href="enviar-correo-formulario.html" id="btnEnviar">Enviar ✉</a>
      </div>
    </div>
  </main>

<script>
  const params = new URLSearchParams(window.location.search);
  const numDocs = params.get('docs') || sessionStorage.getItem('certDocs') || '1';
  const folio = 'CT-' + Math.floor(100000 + Math.random() * 900000);
  const fecha = new Date().toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });

  document.getElementById('folio').textContent = folio;
  document.getElementById('fecha').textContent = fecha;
  document.getElementById('numDocs').textContent = numDocs;

  sessionStorage.setItem('certFolio', folio);
  sessionStorage.setItem('certFecha', fecha);

  document.getElementById('certIcon').addEventListener('click', function(){
    window.location.href = 'ver-certificado.html';
  });

  document.getElementById('btnDescargar').addEventListener('click', function(){
    console.log('Descargando certificado', folio);
    alert('Descargando certificado ' + folio + ' (simulado)');
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
