<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Redactar Correo</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    width: 28px;
    height: 28px;
    background: #ffffff;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--red);
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .compose-card{
    max-width: 640px;
    margin: 0 auto;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .compose-header{
    background: var(--gray-bg);
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 700;
  }

  .field-row{
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--gray-border);
    padding: 10px 18px;
    gap: 10px;
  }

  .field-row label{
    flex: 0 0 44px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .field-row input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 13px;
    padding: 4px 0;
  }

  .attach-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 11.5px;
    margin: 12px 18px 0;
  }

  .toolbar{
    display: flex;
    gap: 4px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--gray-border);
  }

  .toolbar button{
    width: 26px;
    height: 26px;
    border: 1px solid var(--gray-border);
    background: #ffffff;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-dark);
  }

  .toolbar button:hover{
    border-color: var(--red);
    color: var(--red);
  }

  .compose-body{
    padding: 16px 18px 20px;
  }

  .compose-body textarea{
    width: 100%;
    min-height: 200px;
    border: none;
    outline: none;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    line-height: 1.6;
  }

  .compose-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 18px;
    background: var(--gray-bg);
    border-top: 1px solid var(--gray-border);
  }

  .btn{
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  .btn-primary{
    background: var(--red);
    color: #ffffff;
  }

  .btn-primary:hover{
    background: var(--red-dark);
  }

  .btn-secondary{
    background: #ffffff;
    color: var(--text-dark);
    border: 1px solid var(--gray-border);
  }

  .btn-secondary:hover{
    border-color: var(--red);
    color: var(--red);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">UPB</div>
    </div>
    <div class="page-title">📧 Correo</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html">🔔<span class="dot"></span></a>
      <a class="user-chip" href="perfil.html">👤 Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon">🏠</span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon">📄</span> Certificados
    </a>
    <a class="nav-item" data-page="historial">
      <span class="nav-icon">🕘</span> Historial
    </a>
    <a class="nav-item" data-page="configuracion">
      <span class="nav-icon">⚙️</span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon">↪</span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Enviar Correo &nbsp;›&nbsp; Redactar</div>

    <div class="compose-card">
      <div class="compose-header">Enviar Por Correo</div>

      <div class="field-row">
        <label for="fieldPara">Para</label>
        <input type="email" id="fieldPara" placeholder="destinatario@correo.com">
      </div>
      <div class="field-row">
        <label for="fieldCc">CC</label>
        <input type="email" id="fieldCc" placeholder="opcional@correo.com">
      </div>
      <div class="field-row">
        <label for="fieldAsunto">Asunto</label>
        <input type="text" id="fieldAsunto" value="Entrega de Certificado Tributario">
      </div>

      <div class="attach-chip">📎 <span id="attachName">Certificado_Tributario.pdf</span></div>

      <div class="toolbar">
        <button title="Negrita"><b>B</b></button>
        <button title="Cursiva"><i>I</i></button>
        <button title="Subrayado"><u>U</u></button>
        <button title="Lista">☰</button>
        <button title="Alinear">↔</button>
      </div>

      <div class="compose-body">
        <textarea id="fieldMensaje">Estimado(a),

Adjunto encontrará el certificado tributario solicitado. Cualquier inquietud, quedamos atentos.

Cordialmente,
Universidad Politécnica</textarea>
      </div>

      <div class="compose-actions">
        <button class="btn btn-secondary" id="btnGuardarBorrador">Guardar Borrador</button>
        <button class="btn btn-primary" id="btnRevisar">Enviar</button>
      </div>
    </div>
  </main>

<script>
  const attachName = sessionStorage.getItem('certFolio')
    ? 'Certificado_' + sessionStorage.getItem('certFolio') + '.pdf'
    : 'Certificado_Tributario.pdf';
  document.getElementById('attachName').textContent = attachName;

  document.getElementById('btnGuardarBorrador').addEventListener('click', function(){
    const draft = {
      to: document.getElementById('fieldPara').value,
      cc: document.getElementById('fieldCc').value,
      subject: document.getElementById('fieldAsunto').value,
      body: document.getElementById('fieldMensaje').value,
      attachment: attachName
    };
    sessionStorage.setItem('correoBorrador', JSON.stringify(draft));
    alert('Borrador guardado.');
  });

  document.getElementById('btnRevisar').addEventListener('click', function(){
    const to = document.getElementById('fieldPara').value.trim();
    if(!to){
      alert('Ingresa un destinatario antes de continuar.');
      return;
    }
    const draft = {
      to: to,
      cc: document.getElementById('fieldCc').value,
      subject: document.getElementById('fieldAsunto').value,
      body: document.getElementById('fieldMensaje').value,
      attachment: attachName
    };
    sessionStorage.setItem('correoBorrador', JSON.stringify(draft));
    window.location.href = 'borrador.html';
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
