<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Inicio</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  /* ---------- Header ---------- */
  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    display: flex;
    align-items: center;
  }

  .brand .logo-mark img{
    height: 30px;
    width: auto;
    display: block;
  }

  .brand .logo-text{
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
  }

  .search-box{
    flex: 1;
    max-width: 420px;
    margin: 0 24px;
  }

  .search-box input{
    width: 100%;
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    font-size: 13px;
    outline: none;
    background: #ffffff;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    text-decoration: none;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  /* ---------- Main content ---------- */
  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 48px 40px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .welcome{
    text-align: center;
    margin-bottom: 34px;
  }

  .welcome h1{
    font-size: 19px;
    font-weight: 400;
    color: var(--text-muted);
    margin: 0 0 6px;
  }

  .welcome p{
    font-size: 15px;
    color: var(--text-dark);
    margin: 0;
    font-weight: 500;
  }

  .action-grid{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 980px;
    margin: 0 auto;
  }

  .action-card{
    flex: 1 1 220px;
    max-width: 300px;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 16px 22px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    transition: box-shadow .15s ease, transform .1s ease, border-color .15s ease;
  }

  .action-card:hover{
    border-color: var(--red);
    box-shadow: 0 4px 14px rgba(227, 6, 19, 0.12);
    transform: translateY(-1px);
  }

  a.action-card{
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @media (max-width: 720px){
    .action-card{ flex: 1 1 100%; max-width: 100%; }
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
  }
</style>
</head>

    <a class="nav-item logout" href="login.html">
