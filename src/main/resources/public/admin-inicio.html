<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/upb-escudo-hd.png">
<script src="js/avisos.js"></script>
<title>Sistema de Certificados Tributarios - Inicio (Administrador)</title>
<link rel="stylesheet" href="css/roles.css">

<body>
<script>
  if (CT.guard('admin')) CT.shell({ active:'inicio', title:'Administración del sistema' });
</script>

<main class="main">
  <div class="welcome">
    <h1>Bienvenido al Sistema de Certificados Tributarios</h1>
    <p>¿Qué deseas hacer hoy?</p>
  </div>

  <div class="action-grid">
    <a class="action-card" href="admin-usuarios.html">
      <span class="card-icon" id="icUsers"></span>

      <small>Crea, modifica o elimina usuarios, asigna roles y cambia contraseñas</small>
    </a>
    <a class="action-card" href="admin-auditorias.html">
      <span class="card-icon" id="icAud"></span>
      Ver auditorías
      <small>Revisa el registro de acciones realizadas en el sistema</small>

<script>
  document.getElementById('icUsers').innerHTML = CT.svg(CT.ICON.users);
  document.getElementById('icAud').innerHTML   = CT.svg(CT.ICON.shield);
</script>
