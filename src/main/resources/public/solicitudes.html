<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Solicitudes</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --green: #1E8E3E;
    --blue: #2D6CDF;
    --yellow: #C99A00;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    display: flex;
    align-items: center;
  }

  .brand .logo-mark img{
    height: 30px;
    width: auto;
    display: block;
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .section-title{
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 22px;
  }

  .filters-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 780px;
    margin: 0 auto 8px;
  }

  .search-row{
    position: relative;
    flex: 1;
    max-width: 260px;
  }

  .search-row input{
    width: 100%;
    padding: 8px 32px 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--gray-border);
    background: var(--gray-bg);
    font-size: 12.5px;
    outline: none;
  }

  .search-row input:focus{
    border-color: var(--red);
    background: #ffffff;
  }

  .search-row .search-icon{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--text-muted);
  }

  .chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 16px;
    border: 1px solid var(--gray-border);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    background: #ffffff;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .chip .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .chip.completadas .dot{ background: var(--green); }
  .chip.proceso .dot{ background: var(--blue); }
  .chip.pendientes .dot{ background: var(--yellow); }

  .chip.active{
    border-color: var(--red);
    color: var(--text-dark);
    background: #FDECEC;
  }

  .solicitudes-list{
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 780px;
    margin: 22px auto 0;
  }

  .solicitud-item{
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--gray-border);
    border-radius: 8px;
    padding: 14px 18px;
  }

  .solicitud-item .icon{
    font-size: 20px;
    flex: 0 0 auto;
  }

  .solicitud-item .info{
    flex: 1;
    min-width: 0;
  }

  .solicitud-item .cliente{
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .solicitud-item .detalle{
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .solicitud-item .estado-badge{
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .solicitud-item .estado-badge .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .estado-badge.completadas{ color: var(--green); background: #E7F6EC; }
  .estado-badge.completadas .dot{ background: var(--green); }

  .estado-badge.proceso{ color: var(--blue); background: #EAF1FD; }
  .estado-badge.proceso .dot{ background: var(--blue); }

  .estado-badge.pendientes{ color: var(--yellow); background: #FBF3DC; }
  .estado-badge.pendientes .dot{ background: var(--yellow); }

  .empty-state{
    max-width: 780px;
    margin: 60px auto 0;
    text-align: center;
    color: var(--text-muted);
  }

  .empty-state .icon{
    font-size: 54px;
    margin-bottom: 16px;
  }

  .empty-state h3{
    font-size: 14px;
    color: var(--text-dark);
    margin: 0 0 6px;
  }

  .empty-state p{
    font-size: 12.5px;
    margin: 0 0 20px;
  }

  .btn-nueva{
    padding: 10px 22px;
    background: var(--red);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }

  .btn-nueva:hover{
    background: var(--red-dark);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><img src="images/upb-logo.png" alt="UPB"></div>
    </div>
    <div class="page-title">Solicitudes</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></a>
      <a class="user-chip" href="perfil.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Certificados
    </a>
    <a class="nav-item" href="historial.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span> Historial
    </a>
    <a class="nav-item" href="perfil.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Mis solicitudes</div>

    <h2 class="section-title">Solicitudes</h2>

    <div class="filters-row">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Buscar solicitud">
        <span class="search-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></span>
      </div>
      <div class="chip completadas active" data-filter="completadas"><span class="dot"></span> Completadas</div>
      <div class="chip proceso active" data-filter="proceso"><span class="dot"></span> En Proceso</div>
      <div class="chip pendientes active" data-filter="pendientes"><span class="dot"></span> Pendientes</div>
    </div>

    <div class="solicitudes-list" id="solicitudesList"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <h3>Aún no tienes Solicitudes</h3>
      <p>Cuando generes o solicites un certificado, aparecerá aquí para que le hagas seguimiento.</p>
      <a class="btn-nueva" href="generar-certificado.html">Generar Certificado</a>
    </div>
  </main>

<script>
  // Solicitudes de ejemplo (completadas / en proceso)
  const solicitudesBase = [
    { cliente: 'Carlos Ramírez', tipo: 'Certificado de Retención en la Fuente', fecha: '05 sep. 2026', estado: 'completadas' },
    { cliente: 'Ana Torres', tipo: 'Certificado de IVA', fecha: '06 sep. 2026', estado: 'proceso' }
  ];

  // Los certificados devueltos por los clientes pasan a Solicitudes como "Pendientes"
  const devueltos = JSON.parse(sessionStorage.getItem('certificadosDevueltos') || 'null') || [];
  const solicitudesDevueltas = devueltos.map(function(d){
    return {
      cliente: d.cliente,
      tipo: 'Certificado devuelto (Doc. ' + d.documento + ') · ' + d.motivo,
      fecha: d.fecha,
      estado: 'pendientes'
    };
  });

  const solicitudes = solicitudesBase.concat(solicitudesDevueltas);

  const estadoLabel = { completadas: 'Completada', proceso: 'En Proceso', pendientes: 'Pendiente' };

  const solicitudesList = document.getElementById('solicitudesList');
  const emptyState = document.getElementById('emptyState');
  const searchInput = document.getElementById('searchInput');

  function activeFilters(){
    return Array.from(document.querySelectorAll('.chip.active')).map(function(c){ return c.dataset.filter; });
  }

  function renderSolicitudes(){
    const filtros = activeFilters();
    const q = (searchInput.value || '').toLowerCase();

    const filtradas = solicitudes.filter(function(s){
      const coincideFiltro = filtros.includes(s.estado);
      const coincideBusqueda = s.cliente.toLowerCase().includes(q) || s.tipo.toLowerCase().includes(q);
      return coincideFiltro && coincideBusqueda;
    });

    if(filtradas.length === 0){
      solicitudesList.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    emptyState.style.display = 'none';
    solicitudesList.style.display = 'flex';
    solicitudesList.innerHTML = '';

    filtradas.forEach(function(s){
      const item = document.createElement('div');
      item.className = 'solicitud-item';
      item.innerHTML =
        '<span class="icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>' +
        '<div class="info">' +
          '<div class="cliente">' + s.cliente + '</div>' +
          '<div class="detalle">' + s.tipo + ' &middot; ' + s.fecha + '</div>' +
        '</div>' +
        '<span class="estado-badge ' + s.estado + '"><span class="dot"></span>' + estadoLabel[s.estado] + '</span>';
      solicitudesList.appendChild(item);
    });
  }

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      chip.classList.toggle('active');
      renderSolicitudes();
    });
  });

  searchInput.addEventListener('input', renderSolicitudes);

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });

  renderSolicitudes();
</script>

</body>
</html>
