<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Enviar por Correo</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    width: 28px;
    height: 28px;
    background: #ffffff;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--red);
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .mail-layout{
    display: flex;
    gap: 26px;
    max-width: 880px;
    margin: 0 auto;
  }

  .mail-rail{
    flex: 0 0 130px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .mail-rail-item{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    font-size: 12px;
    border-radius: 6px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
  }

  .mail-rail-item:hover{
    background: var(--gray-bg);
  }

  .mail-rail-item.active{
    background: #FDECEC;
    color: var(--red);
    font-weight: 700;
  }

  .mail-main{
    flex: 1;
    min-width: 0;
  }

  .mail-toolbar{
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .mail-search{
    flex: 1;
    position: relative;
  }

  .mail-search input{
    width: 100%;
    padding: 8px 34px 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--gray-border);
    background: var(--gray-bg);
    font-size: 12.5px;
    outline: none;
  }

  .mail-search input:focus{
    border-color: var(--red);
    background: #ffffff;
  }

  .mail-search .search-icon{
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--text-muted);
  }

  .btn-compose{
    padding: 9px 18px;
    background: var(--red);
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-compose:hover{
    background: var(--red-dark);
  }

  .mail-list{
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .mail-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--gray-border);
    font-size: 12.5px;
    cursor: pointer;
  }

  .mail-item:last-child{ border-bottom: none; }

  .mail-item:hover{ background: var(--gray-bg); }

  .mail-item .mail-icon{
    font-size: 16px;
  }

  .mail-item .mail-info{
    flex: 1;
    min-width: 0;
  }

  .mail-item .mail-to{
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mail-item .mail-subject{
    color: var(--text-muted);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mail-item .mail-date{
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .mail-item .mail-status{
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .mail-status.enviado{
    color: #1E8E3E;
    background: #E7F6EC;
  }

  .empty-mail{
    text-align: center;
    padding: 50px 10px;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .mail-layout{ flex-direction: column; }
    .mail-rail{ flex-direction: row; overflow-x: auto; flex: none; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">UPB</div>
    </div>
    <div class="page-title">📧 Correo</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html">🔔<span class="dot"></span></a>
      <a class="user-chip" href="perfil.html">👤 Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon">🏠</span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon">📄</span> Certificados
    </a>
    <a class="nav-item" data-page="historial">
      <span class="nav-icon">🕘</span> Historial
    </a>
    <a class="nav-item" data-page="configuracion">
      <span class="nav-icon">⚙️</span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon">↪</span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Enviar Correo</div>

    <div class="mail-layout">
      <div class="mail-rail">
        <a class="mail-rail-item active"><span>📤</span> Enviar</a>
        <a class="mail-rail-item" data-page="contactos"><span>👥</span> Contactos</a>
        <a class="mail-rail-item" data-page="enviados"><span>📬</span> Enviados</a>
        <a class="mail-rail-item" data-page="papelera"><span>🗑️</span> Papelera</a>
      </div>

      <div class="mail-main">
        <div class="mail-toolbar">
          <div class="mail-search">
            <input type="text" id="searchInput" placeholder="Buscar por destinatario o certificado">
            <span class="search-icon">🔍</span>
          </div>
          <a class="btn-compose" href="enviar-correo-formulario.html">+ Nuevo Correo</a>
        </div>

        <ul class="mail-list" id="mailList"></ul>
      </div>
    </div>
  </main>

<script>
  let correos = JSON.parse(sessionStorage.getItem('correosEnviados') || 'null') || [
    { to: 'juan.perez@correo.com', subject: 'Entrega de Certificado Tributario', date: '02 sep. 2026', status: 'Enviado' },
    { to: 'maria.gomez@correo.com', subject: 'Certificado de Retención en la Fuente', date: '28 ago. 2026', status: 'Enviado' },
    { to: 'contabilidad@empresa.com', subject: 'Certificado de IVA - Tercer Trimestre', date: '15 ago. 2026', status: 'Enviado' }
  ];

  const mailList = document.getElementById('mailList');
  const searchInput = document.getElementById('searchInput');

  function renderList(filter){
    mailList.innerHTML = '';
    const filtered = correos.filter(function(c){
      const q = (filter || '').toLowerCase();
      return c.to.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q);
    });

    if(filtered.length === 0){
      mailList.innerHTML = '<div class="empty-mail">No se encontraron correos.</div>';
      return;
    }

    filtered.slice().reverse().forEach(function(c){
      const li = document.createElement('li');
      li.className = 'mail-item';
      li.innerHTML =
        '<span class="mail-icon">📄</span>' +
        '<div class="mail-info">' +
          '<div class="mail-to">' + c.to + '</div>' +
          '<div class="mail-subject">' + c.subject + '</div>' +
        '</div>' +
        '<span class="mail-date">' + c.date + '</span>' +
        '<span class="mail-status enviado">' + c.status + '</span>';
      mailList.appendChild(li);
    });
  }

  searchInput.addEventListener('input', function(){
    renderList(searchInput.value);
  });

  document.querySelectorAll('.mail-rail-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });

  renderList('');
</script>

</body>
</html>
