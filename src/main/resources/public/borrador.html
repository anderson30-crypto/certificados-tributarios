<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Revisar Borrador</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    width: 28px;
    height: 28px;
    background: #ffffff;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: var(--red);
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .preview-card{
    max-width: 560px;
    margin: 10px auto 0;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .preview-from{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-border);
  }

  .preview-avatar{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--gray-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .preview-from .name{
    font-size: 13px;
    font-weight: 700;
  }

  .preview-from .to-line{
    font-size: 11px;
    color: var(--text-muted);
  }

  .preview-body{
    padding: 22px 24px;
  }

  .preview-subject{
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    margin: 0 0 18px;
  }

  .preview-text{
    font-size: 12.5px;
    line-height: 1.8;
    color: var(--text-dark);
    white-space: pre-line;
    margin: 0 0 20px;
  }

  .preview-attach{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
  }

  .preview-actions{
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px 22px;
    border-top: 1px solid var(--gray-border);
  }

  .btn{
    padding: 10px 26px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  .btn-primary{
    background: var(--red);
    color: #ffffff;
  }

  .btn-primary:hover{
    background: var(--red-dark);
  }

  .btn-secondary{
    background: #ffffff;
    color: var(--text-dark);
    border: 1px solid var(--gray-border);
  }

  .btn-secondary:hover{
    border-color: var(--red);
    color: var(--red);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">UPB</div>
    </div>
    <div class="page-title">📧 Correo · Borrador</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html">🔔<span class="dot"></span></a>
      <a class="user-chip" href="perfil.html">👤 Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon">🏠</span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon">📄</span> Certificados
    </a>
    <a class="nav-item" data-page="historial">
      <span class="nav-icon">🕘</span> Historial
    </a>
    <a class="nav-item" data-page="configuracion">
      <span class="nav-icon">⚙️</span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon">↪</span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Enviar Correo &nbsp;›&nbsp; Borrador</div>

    <div class="preview-card">
      <div class="preview-from">
        <div class="preview-avatar">👤</div>
        <div>
          <div class="name">Usuario</div>
          <div class="to-line">Para: <span id="toLine"></span></div>
        </div>
      </div>

      <div class="preview-body">
        <p class="preview-subject" id="subjectTxt">ENTREGA DEL CERTIFICADO TRIBUTARIO</p>
        <p class="preview-text" id="bodyTxt"></p>
        <div class="preview-attach">📎 <span id="attachTxt"></span></div>
      </div>

      <div class="preview-actions">
        <a class="btn btn-secondary" href="enviar-correo-formulario.html">Cancelar</a>
        <button class="btn btn-primary" id="btnEnviarFinal">Enviar</button>
      </div>
    </div>
  </main>

<script>
  const draft = JSON.parse(sessionStorage.getItem('correoBorrador') || 'null') || {
    to: 'destinatario@correo.com',
    subject: 'Entrega de Certificado Tributario',
    body: 'Adjunto encontrará el certificado tributario solicitado.',
    attachment: 'Certificado_Tributario.pdf'
  };

  document.getElementById('toLine').textContent = draft.to;
  document.getElementById('subjectTxt').textContent = (draft.subject || 'Entrega del Certificado Tributario').toUpperCase();
  document.getElementById('bodyTxt').textContent = draft.body;
  document.getElementById('attachTxt').textContent = draft.attachment;

  document.getElementById('btnEnviarFinal').addEventListener('click', function(){
    const correos = JSON.parse(sessionStorage.getItem('correosEnviados') || 'null') || [];
    correos.push({
      to: draft.to,
      subject: draft.subject,
      date: new Date().toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }),
      status: 'Enviado'
    });
    sessionStorage.setItem('correosEnviados', JSON.stringify(correos));
    sessionStorage.removeItem('correoBorrador');
    alert('Correo enviado correctamente a ' + draft.to);
    window.location.href = 'enviar-correo.html';
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
