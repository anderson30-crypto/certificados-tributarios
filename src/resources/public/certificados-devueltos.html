<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Certificados Devueltos</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    display: flex;
    align-items: center;
  }

  .brand .logo-mark img{
    height: 30px;
    width: auto;
    display: block;
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .section-title{
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 26px;
  }

  .devoluciones-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
    max-width: 820px;
    margin: 0 auto;
  }

  .devolucion-card{
    border: 1px solid var(--gray-border);
    border-radius: 8px;
    padding: 16px 18px;
    position: relative;
  }

  .badge-devuelto{
    position: absolute;
    top: 14px;
    right: 14px;
    background: #FDECEC;
    color: var(--red);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
  }

  .devolucion-card .cliente{
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .devolucion-card .detalle{
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .devolucion-card .motivo{
    font-size: 11.5px;
    color: var(--text-dark);
    background: var(--gray-bg);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 14px;
  }

  .devolucion-actions{
    display: flex;
    gap: 8px;
  }

  .btn-small{
    flex: 1;
    padding: 8px 10px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    text-align: center;
  }

  .btn-small.download{
    background: #ffffff;
    border: 1px solid var(--gray-border);
    color: var(--text-dark);
  }

  .btn-small.download:hover{
    border-color: var(--red);
    color: var(--red);
  }

  .btn-small.reenviar{
    background: var(--red);
    color: #ffffff;
  }

  .btn-small.reenviar:hover{
    background: var(--red-dark);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><img src="images/upb-logo.png" alt="UPB"></div>
    </div>
    <div class="page-title">Certificados Devueltos</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></a>
      <a class="user-chip" href="perfil.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Certificados
    </a>
    <a class="nav-item" href="historial.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span> Historial
    </a>
    <a class="nav-item" href="perfil.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Certificados Devueltos</div>

    <h2 class="section-title">Certificados Devueltos Por Los Clientes</h2>

    <div class="devoluciones-grid" id="devolucionesGrid"></div>
  </main>

<script>
  const devoluciones = [
    {
      cliente: 'Luis Pardo',
      documento: '109.582',
      fecha: '01 sep. 2026',
      motivo: 'El nombre en el certificado no coincide con el registrado en el sistema.'
    },
    {
      cliente: 'Laura Muñoz',
      documento: '1.020.581',
      fecha: '30 ago. 2026',
      motivo: 'Solicita corrección del valor certificado del período gravable.'
    }
  ];

  // Los certificados devueltos también deben verse reflejados como
  // solicitudes "Pendientes" en la sección de Solicitudes.
  sessionStorage.setItem('certificadosDevueltos', JSON.stringify(devoluciones));

  const grid = document.getElementById('devolucionesGrid');

  devoluciones.forEach(function(d){
    const card = document.createElement('div');
    card.className = 'devolucion-card';
    card.innerHTML =
      '<span class="badge-devuelto"><svg class="icon" viewBox="0 0 24 24" width="0.5em" height="0.5em" style="vertical-align:0.05em;flex-shrink:0" fill="currentColor"><circle cx="12" cy="12" r="12"/></svg> DEVUELTO</span>' +
      '<div class="cliente">Cliente: ' + d.cliente + '</div>' +
      '<div class="detalle">' +
        'Documento ID: ' + d.documento + '<br>' +
        'Fecha de Devolución: ' + d.fecha +
      '</div>' +
      '<div class="motivo">Motivo: ' + d.motivo + '</div>' +
      '<div class="devolucion-actions">' +
        '<button class="btn-small download"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar</button>' +
        '<button class="btn-small reenviar">Reenviar</button>' +
      '</div>';
    grid.appendChild(card);
  });

  grid.addEventListener('click', function(e){
    if(e.target.classList.contains('download')){
      alert('Descargando certificado devuelto (simulado).');
    }
    if(e.target.classList.contains('reenviar')){
      window.location.href = 'enviar-correo-formulario.html';
    }
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
