<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Certificados Tributarios - Redactar Correo</title>
<style>
  :root{
    --red: #E30613;
    --red-dark: #C40510;
    --gray-bg: #F4F5F7;
    --gray-border: #E1E3E8;
    --text-dark: #23262B;
    --text-muted: #6B7078;
    --sidebar-w: 190px;
    --header-h: 58px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-dark);
    background: #ffffff;
  }

  .topbar{
    height: var(--header-h);
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }

  .topbar .brand{
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 var(--sidebar-w);
  }

  .brand .logo-mark{
    display: flex;
    align-items: center;
  }

  .brand .logo-mark img{
    height: 30px;
    width: auto;
    display: block;
  }

  .topbar .page-title{
    flex: 1;
    text-align: center;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
  }

  .topbar-actions{
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    flex: 0 0 var(--sidebar-w);
    justify-content: flex-end;
  }

  .icon-btn{
    background: none;
    border: none;
    cursor: pointer;
    color: #ffffff;
    font-size: 18px;
    position: relative;
    padding: 4px;
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .icon-btn .dot{
    position: absolute;
    top: 2px; right: 2px;
    width: 7px; height: 7px;
    background: #FFD400;
    border-radius: 50%;
    border: 1px solid var(--red);
  }

  .user-chip{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #ffffff;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }

  .sidebar{
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    width: var(--sidebar-w);
    background: #ffffff;
    border-right: 1px solid var(--gray-border);
    padding-top: 14px;
    z-index: 10;
  }

  .nav-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    font-size: 13px;
    color: var(--text-dark);
    text-decoration: none;
    cursor: pointer;
    border-left: 3px solid transparent;
  }

  .nav-item .nav-icon{
    width: 18px;
    text-align: center;
    font-size: 15px;
  }

  .nav-item:hover{
    background: var(--gray-bg);
  }

  .nav-item.active{
    color: var(--red);
    font-weight: 600;
    border-left-color: var(--red);
    background: #FDECEC;
  }

  .nav-item.logout{
    margin-top: 30px;
    color: var(--text-muted);
  }

  .main{
    margin-left: var(--sidebar-w);
    margin-top: var(--header-h);
    padding: 26px 40px 50px;
    min-height: calc(100vh - var(--header-h));
    background: #ffffff;
  }

  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .compose-card{
    max-width: 640px;
    margin: 0 auto;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    overflow: hidden;
  }

  .compose-header{
    background: var(--gray-bg);
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 700;
  }

  .field-row{
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--gray-border);
    padding: 10px 18px;
    gap: 10px;
  }

  .field-row label{
    flex: 0 0 44px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .field-row input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 13px;
    padding: 4px 0;
  }

  .attach-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gray-bg);
    border: 1px solid var(--gray-border);
    border-radius: 16px;
    padding: 5px 12px;
    font-size: 11.5px;
    margin: 12px 18px 0;
  }

  .toolbar{
    display: flex;
    gap: 4px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--gray-border);
  }

  .toolbar button{
    width: 26px;
    height: 26px;
    border: 1px solid var(--gray-border);
    background: #ffffff;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-dark);
  }

  .toolbar button:hover{
    border-color: var(--red);
    color: var(--red);
  }

  .compose-body{
    padding: 16px 18px 20px;
  }

  .compose-body textarea{
    width: 100%;
    min-height: 200px;
    border: none;
    outline: none;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    line-height: 1.6;
  }

  .compose-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 18px;
    background: var(--gray-bg);
    border-top: 1px solid var(--gray-border);
  }

  .btn{
    padding: 9px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }

  .btn-primary{
    background: var(--red);
    color: #ffffff;
  }

  .btn-primary:hover{
    background: var(--red-dark);
  }

  .btn-secondary{
    background: #ffffff;
    color: var(--text-dark);
    border: 1px solid var(--gray-border);
  }

  .btn-secondary:hover{
    border-color: var(--red);
    color: var(--red);
  }

  @media (max-width: 720px){
    .sidebar{ display: none; }
    .main{ margin-left: 0; }
    .topbar .brand, .topbar-actions{ flex: 0 0 auto; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><img src="images/upb-logo.png" alt="UPB"></div>
    </div>
    <div class="page-title"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/></svg> Correo</div>
    <div class="topbar-actions">
      <a class="icon-btn" title="Notificaciones" href="notificaciones-error.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="dot"></span></a>
      <a class="user-chip" href="perfil.html"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Usuario</a>
    </div>
  </header>

  <nav class="sidebar">
    <a class="nav-item" href="inicio.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></span> Inicio
    </a>
    <a class="nav-item" href="subir-documentos.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Certificados
    </a>
    <a class="nav-item" href="historial.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span> Historial
    </a>
    <a class="nav-item" href="perfil.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Configuración
    </a>
    <a class="nav-item logout" href="login.html">
      <span class="nav-icon"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span> Cerrar Sesión
    </a>
  </nav>

  <main class="main">
    <div class="breadcrumb">Inicio &nbsp;›&nbsp; Enviar Correo &nbsp;›&nbsp; Redactar</div>

    <div class="compose-card">
      <div class="compose-header">Enviar Por Correo</div>

      <div class="field-row">
        <label for="fieldPara">Para</label>
        <input type="email" id="fieldPara" placeholder="destinatario@correo.com">
      </div>
      <div class="field-row">
        <label for="fieldCc">CC</label>
        <input type="email" id="fieldCc" placeholder="opcional@correo.com">
      </div>
      <div class="field-row">
        <label for="fieldAsunto">Asunto</label>
        <input type="text" id="fieldAsunto" value="Entrega de Certificado Tributario">
      </div>

      <div class="attach-chip"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.48"/></svg> <span id="attachName">Certificado_Tributario.pdf</span></div>

      <div class="toolbar">
        <button title="Negrita"><b>B</b></button>
        <button title="Cursiva"><i>I</i></button>
        <button title="Subrayado"><u>U</u></button>
        <button title="Lista"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <button title="Alinear"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"/><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg></button>
      </div>

      <div class="compose-body">
        <textarea id="fieldMensaje">Estimado(a),

Adjunto encontrará el certificado tributario solicitado. Cualquier inquietud, quedamos atentos.

Cordialmente,
Universidad Politécnica</textarea>
      </div>

      <div class="compose-actions">
        <button class="btn btn-secondary" id="btnGuardarBorrador">Guardar Borrador</button>
        <button class="btn btn-primary" id="btnRevisar">Enviar</button>
      </div>
    </div>
  </main>

<script>
  const attachName = sessionStorage.getItem('certFolio')
    ? 'Certificado_' + sessionStorage.getItem('certFolio') + '.pdf'
    : 'Certificado_Tributario.pdf';
  document.getElementById('attachName').textContent = attachName;

  document.getElementById('btnGuardarBorrador').addEventListener('click', function(){
    const draft = {
      to: document.getElementById('fieldPara').value,
      cc: document.getElementById('fieldCc').value,
      subject: document.getElementById('fieldAsunto').value,
      body: document.getElementById('fieldMensaje').value,
      attachment: attachName
    };
    sessionStorage.setItem('correoBorrador', JSON.stringify(draft));
    alert('Borrador guardado.');
  });

  document.getElementById('btnRevisar').addEventListener('click', function(){
    const to = document.getElementById('fieldPara').value.trim();
    if(!to){
      alert('Ingresa un destinatario antes de continuar.');
      return;
    }
    const draft = {
      to: to,
      cc: document.getElementById('fieldCc').value,
      subject: document.getElementById('fieldAsunto').value,
      body: document.getElementById('fieldMensaje').value,
      attachment: attachName
    };
    sessionStorage.setItem('correoBorrador', JSON.stringify(draft));
    window.location.href = 'borrador.html';
  });

  document.querySelectorAll('.nav-item[data-page]').forEach(function(item){
    item.addEventListener('click', function(e){
      e.preventDefault();
      console.log('Sección aún no implementada:', item.dataset.page);
    });
  });
</script>

</body>
</html>
